{# Kartu lokasi: peta Leaflet + alamat + tombol Google Maps. Butuh variabel `event`. #}
<div class="rounded-2xl border border-gray-200 bg-white overflow-hidden">
  {% if event.lat is not None %}<div id="map" class="h-72 sm:h-80 z-0" aria-label="Peta lokasi {{ event.venue }}"></div>{% endif %}
  <div class="p-4 flex flex-col sm:flex-row sm:items-center gap-3">
    <div class="flex-1">
      <p class="font-bold">{{ event.venue }}</p>
      <p class="text-sm text-gray-600">{{ event.address|default:event.city }}</p>
    </div>
    {% if event.lat is not None %}
    <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query={{ event.lat|stringformat:"f" }},{{ event.lng|stringformat:"f" }}"
       class="inline-flex h-11 items-center justify-center px-4 rounded-lg border border-gray-300 text-sm font-semibold hover:border-gray-900">Buka di Google Maps</a>
    {% endif %}
  </div>
</div>
{% if event.lat is not None %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  (() => {
    const at = [{{ event.lat|stringformat:"f" }}, {{ event.lng|stringformat:"f" }}];
    const map = L.map("map", { scrollWheelZoom: false }).setView(at, 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
    L.marker(at).addTo(map).bindPopup("{{ event.venue|escapejs }}").openPopup();
  })();
</script>
{% endif %}
