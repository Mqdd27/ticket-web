<section class="max-w-7xl mx-auto px-4 lg:px-8 mt-12" data-all-events="{% url 'section_events' b.s.pk %}">
  {% url 'event_list' as more %}{% include "sections/_head.html" %}
  <div class="scroll-row flex gap-2 overflow-x-auto -mx-4 px-4 lg:mx-0 lg:px-0 mb-4" role="group" aria-label="Filter kategori">
    <button type="button" data-cat="" aria-pressed="true" class="chip">Semua</button>
    {% for c in b.categories %}<button type="button" data-cat="{{ c.slug }}" aria-pressed="false" class="chip">{{ c.name }}</button>{% endfor %}
  </div>
  <div class="grid gap-3 md:grid-cols-2 transition-opacity" data-list aria-live="polite">{% include "sections/_list.html" %}</div>
</section>
<script>
document.querySelectorAll("[data-all-events]").forEach((sec) => {
  const list = sec.querySelector("[data-list]"), more = sec.querySelector("a[href$='/acara/'], a[href*='/acara/?']");
  sec.querySelectorAll("[data-cat]").forEach((btn) => btn.addEventListener("click", async () => {
    sec.querySelectorAll("[data-cat]").forEach((b) => b.setAttribute("aria-pressed", b === btn));
    list.style.opacity = 0.4;
    const cat = btn.dataset.cat;
    list.innerHTML = await (await fetch(sec.dataset.allEvents + "?cat=" + encodeURIComponent(cat))).text();
    list.style.opacity = 1;
    if (more) more.href = "/acara/" + (cat ? "?cat=" + encodeURIComponent(cat) : "");
  }));
});
</script>
