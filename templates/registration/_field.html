<div>
  <label for="{{ f.id_for_label }}" class="block text-sm font-semibold mb-1">{{ f.label }}</label>
  <input type="{{ f.field.widget.input_type }}" name="{{ f.html_name }}" id="{{ f.id_for_label }}" value="{% if f.field.widget.input_type != 'password' %}{{ f.value|default:'' }}{% endif %}"
         autocomplete="{{ ac }}" class="w-full h-12 rounded-xl border px-4 outline-none focus:ring-2 focus:ring-blue-500 {% if f.errors %}border-red-500{% else %}border-gray-300{% endif %}">
  {% for e in f.errors %}<p class="mt-1 text-sm text-red-600">{{ e }}</p>{% endfor %}
  {% if hint and not f.errors %}<p class="mt-1 text-xs text-gray-500">{{ hint }}</p>{% endif %}
</div>
