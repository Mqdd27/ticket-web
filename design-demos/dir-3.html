<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karcis · Arah 3 · Daftar Fungsional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #141414; --muted: #5e5e5e; --line: #e3e3e3; --bg: #fff; --soft: #f6f6f4; --link: #1746d1; --warn: #c3260c; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 "IBM Plex Sans", system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  header.top { border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); z-index: 20; }
  header.top .wrap { height: 64px; display: flex; align-items: center; gap: 20px; }
  .logo { font-weight: 700; font-size: 19px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .logo i { width: 18px; height: 12px; background: var(--ink); border-radius: 2px; -webkit-mask: radial-gradient(circle at 0 50%, transparent 3px, #000 3.5px) left/51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 3px, #000 3.5px) right/51% 100% no-repeat; mask: radial-gradient(circle at 0 50%, transparent 3px, #000 3.5px) left/51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 3px, #000 3.5px) right/51% 100% no-repeat; }
  .search { flex: 1; max-width: 520px; position: relative; }
  .search input { width: 100%; height: 42px; border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 0 14px 0 38px; outline: 0; font-size: 15px; }
  .search input:focus { border-color: var(--ink); background: #fff; }
  .search svg { position: absolute; left: 12px; top: 13px; }
  .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .b { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-weight: 600; font-size: 14px; }
  .b:hover { border-color: var(--ink); }
  .b.p { background: var(--ink); color: #fff; border-color: var(--ink); }
  .b.p:hover { background: #333; }
  .b[disabled] { background: #d6d6d6; border-color: #d6d6d6; color: #777; cursor: not-allowed; }
  .who { color: var(--muted); font-size: 14px; }

  .layout > * { min-width: 0; }
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 40px; padding-top: 28px; padding-bottom: 80px; }
  aside.f h4 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin: 4px 0 8px; }
  aside.f button { display: flex; width: 100%; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 10px; border: 0; background: none; border-radius: 6px; cursor: pointer; font-size: 15px; text-align: left; }
  aside.f button:hover { background: var(--soft); }
  aside.f button[aria-pressed=true] { background: var(--ink); color: #fff; }
  aside.f button span { color: inherit; opacity: .6; font-size: 13px; }
  aside.f .cities { margin-top: 24px; font-size: 14px; color: var(--muted); }
  aside.f .cities li { list-style: none; display: flex; justify-content: space-between; padding: 6px 10px; }
  aside.f ul { padding: 0; }

  .intro { display: flex; justify-content: space-between; align-items: end; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--ink); }
  .intro h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  .intro p { color: var(--muted); font-size: 14px; }
  .day { font-weight: 600; font-size: 14px; padding: 18px 0 8px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .day span { color: var(--muted); font-weight: 400; }
  .ev { display: grid; grid-template-columns: 132px 1fr 200px; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .ev:hover h3 { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
  .ev img { width: 132px; height: 88px; object-fit: cover; border-radius: 6px; display: block; background: var(--soft); }
  .ev h3 { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .ev .where { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .ev .cat { display: inline-block; font-size: 12px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; margin-top: 8px; }
  .ev .r { text-align: right; }
  .ev .price { font-weight: 600; font-size: 16px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin: 8px 0 4px auto; width: 140px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ink); }
  .bar.hot i { background: var(--warn); }
  .left { font-size: 13px; color: var(--muted); }
  .left.hot { color: var(--warn); font-weight: 600; }
  .empty { padding: 40px 0; color: var(--muted); }

  /* detail */
  .crumb { padding: 20px 0 0; font-size: 14px; color: var(--muted); }
  .crumb a { color: var(--link); display: inline-flex; min-height: 44px; align-items: center; }
  .dl { display: grid; grid-template-columns: 1fr 400px; gap: 48px; padding-bottom: 96px; }
  .dl img.hero { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; }
  .dl h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.15; letter-spacing: -0.015em; margin: 24px 0 16px; }
  table.meta { border-collapse: collapse; width: 100%; margin-bottom: 28px; }
  table.meta th { text-align: left; font-weight: 500; color: var(--muted); width: 140px; padding: 10px 0; border-top: 1px solid var(--line); vertical-align: top; }
  table.meta td { padding: 10px 0; border-top: 1px solid var(--line); }
  .dl h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .dl .about p { margin-bottom: 12px; max-width: 62ch; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 20px; position: sticky; top: 88px; align-self: start; }
  .tt { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
  .tt:first-of-type { padding-top: 4px; }
  .tt b { font-weight: 600; }
  .tt .pr { font-weight: 600; }
  .tt .bar { margin: 0; width: 100%; }
  .tt .meta2 { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .q { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; }
  .q button { width: 40px; height: 40px; border: 0; background: none; cursor: pointer; font-size: 18px; }
  .q button:disabled { opacity: .3; cursor: default; }
  .q span { width: 28px; text-align: center; font-weight: 600; }
  .tot { display: flex; justify-content: space-between; padding: 16px 0; font-size: 15px; }
  .tot b { font-size: 20px; }
  .box .b.p { width: 100%; height: 48px; font-size: 15px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 10px; }

  /* auth */
  .authwrap { background: var(--soft); min-height: calc(100vh - 64px); display: grid; place-items: start center; padding: 48px 20px 80px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 32px; width: 100%; max-width: 420px; }
  .card h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .card .lead { color: var(--muted); margin-bottom: 20px; font-size: 14px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; padding: 3px; margin-bottom: 24px; background: var(--soft); }
  .seg a { text-align: center; padding: 9px; border-radius: 6px; font-weight: 600; font-size: 14px; color: var(--muted); min-height: 40px; }
  .seg a.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  label { display: block; font-size: 14px; font-weight: 500; margin: 14px 0 6px; }
  .in { width: 100%; height: 46px; border: 1px solid #cfcfcf; border-radius: 8px; padding: 0 12px; font-size: 16px; outline: 0; }
  .in:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(20,20,20,.08); }
  .in.bad { border-color: var(--warn); }
  .err { color: var(--warn); font-size: 13px; margin-top: 4px; }
  .card .b.p { width: 100%; height: 48px; margin-top: 24px; }
  .card .alt { text-align: center; margin-top: 16px; font-size: 14px; color: var(--muted); }
  .card .alt a { color: var(--link); }
  .why { max-width: 420px; width: 100%; margin-top: 20px; font-size: 14px; color: var(--muted); }
  .why li { margin: 4px 0 4px 18px; }

  /* checkout */
  .steps { display: flex; gap: 8px; padding: 24px 0; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
  .steps b { color: var(--ink); }
  .warnbar { background: #fff6d6; border: 1px solid #f0d77a; border-radius: 10px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; }
  .warnbar b { font-size: 22px; }
  .pm { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: #fff; cursor: pointer; margin-bottom: 8px; min-height: 60px; }
  .pm[aria-pressed=true] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .pm .o { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #999; flex: none; }
  .pm[aria-pressed=true] .o { border: 5px solid var(--ink); }
  .pm small { display: block; color: var(--muted); font-size: 13px; }
  .row2 { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }

  /* done */
  .et { max-width: 560px; margin: 32px auto 96px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .et .ok { background: #e9f7ef; color: #0d6b3b; padding: 14px 20px; font-weight: 600; font-size: 14px; }
  .et .in2 { padding: 24px; display: grid; grid-template-columns: 1fr 160px; gap: 24px; align-items: center; }
  .et h1 { font-size: 22px; margin-bottom: 12px; }
  .et svg { width: 160px; height: 160px; }
  .et code { display: block; text-align: center; margin-top: 6px; letter-spacing: .12em; }
  .et .foot { border-top: 1px dashed #cfcfcf; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  .mbar { display: none; }
  @media (max-width: 880px) {
    header.top .wrap { flex-wrap: wrap; height: auto; padding-top: 10px; padding-bottom: 10px; gap: 10px; }
    .search { order: 3; flex-basis: 100%; max-width: none; }
    .who { display: none; }
    .layout { grid-template-columns: 1fr; gap: 16px; padding-top: 16px; }
    aside.f h4, aside.f .cities { display: none; }
    aside.f > div { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    aside.f button { width: auto; flex: none; border: 1px solid var(--line); border-radius: 999px; gap: 8px; padding: 0 14px; }
    .ev { grid-template-columns: 96px 1fr; gap: 14px; }
    .ev img { width: 96px; height: 72px; }
    .ev .r { grid-column: 2; text-align: left; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ev .bar { margin: 0; width: 80px; }
    .dl { grid-template-columns: 1fr; gap: 24px; }
    .box { position: static; }
    .box .b.p.wide { display: none; }
    .et .in2 { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .mbar { display: flex; position: fixed; inset: auto 0 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); justify-content: space-between; align-items: center; gap: 12px; z-index: 30; }
    .mbar .b { min-width: 150px; height: 48px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>';
const topbar = (c, search) => `<header class="top"><div class="wrap">
  <a class="logo" href="#/"><i></i>Karcis</a>
  ${search ? `<label class="search"><span style="position:absolute;left:-9999px">Cari event</span>${icon}<input id="q" type="search" placeholder="Cari event, artis, venue, kota" value="${c.esc(c.q)}"></label>` : ""}
  <div class="acts">${c.user ? `<span class="who">${c.esc(c.user.email)}</span><button class="b" data-act="logout">Keluar</button>`
    : `<a class="b" href="#/login">Masuk</a><a class="b p" href="#/register">Daftar</a>`}</div>
</div></header>`;

const pct = (t) => Math.round(((t.quota - t.left) / t.quota) * 100);
const best = (e) => e.tickets.reduce((a, t) => ({ left: a.left + t.left, quota: a.quota + t.quota }), { left: 0, quota: 0 });

function list(c) {
  if (!c.list.length) return `<p class="empty">Tidak ada hasil untuk "${c.esc(c.q)}".</p>`;
  let last = "", out = "";
  for (const e of c.list) {
    const d = c.dt(e.date, { weekday: "long", day: "numeric", month: "long" });
    if (d !== last) { out += `<div class="day">${d}</div>`; last = d; }
    const s = best(e), hot = s.left > 0 && s.left <= 30;
    out += `<a class="ev" href="#/event/${e.id}">
      <img src="${e.img}" alt="" loading="lazy">
      <div><h3>${e.title}</h3><div class="where">${e.venue} · ${e.city} · 19.00</div><span class="cat">${e.cat}</span></div>
      <div class="r"><div class="price">${e.soldOut ? "Habis" : e.from ? "dari " + c.rp(e.from) : "Gratis"}</div>
        <div class="bar ${hot ? "hot" : ""}" title="${pct(s)}% terjual"><i style="width:${pct(s)}%"></i></div>
        <div class="left mono ${hot || !s.left ? "hot" : ""}">${s.left ? `sisa ${s.left} / ${s.quota}` : "terjual habis"}</div></div>
    </a>`;
  }
  return out;
}

const fld = (c, n, lab, type = "text", ac = "") => `<label for="${n}">${lab}</label>
  <input class="in${c.errors[n] ? " bad" : ""}" id="${n}" name="${n}" type="${type}" autocomplete="${ac}" value="${type === "password" ? "" : c.esc(c.values[n])}">
  ${c.errors[n] ? `<div class="err">${c.errors[n]}</div>` : ""}`;

const auth = (c, reg) => `${topbar(c, false)}<div class="authwrap"><div style="width:100%;max-width:420px">
  <form class="card" data-form="${reg ? "register" : "login"}" novalidate>
    <div class="seg"><a href="#/login" class="${reg ? "" : "on"}">Masuk</a><a href="#/register" class="${reg ? "on" : ""}">Daftar</a></div>
    <h1>${reg ? "Buat akun Karcis" : "Masuk ke Karcis"}</h1>
    <p class="lead">${c.next ? "Pilihan tiketmu tersimpan. Masuk untuk lanjut bayar." : reg ? "Gratis. Butuh kurang dari 1 menit." : "Pakai email yang kamu daftarkan."}</p>
    ${reg ? fld(c, "name", "Nama lengkap", "text", "name") : ""}
    ${fld(c, "email", "Email", "email", "email")}
    ${fld(c, "password", "Password", "password", reg ? "new-password" : "current-password")}
    ${reg ? fld(c, "password2", "Ulangi password", "password", "new-password") : ""}
    <button class="b p" type="submit">${reg ? "Daftar" : "Masuk"}</button>
    <p class="alt">${reg ? 'Sudah punya akun? <a href="#/login">Masuk</a>' : 'Belum punya akun? <a href="#/register">Daftar</a>'}</p>
  </form>
  <ul class="why"><li>E-ticket QR tersimpan di akun, bisa dibuka offline</li><li>Riwayat pembelian & invoice</li><li>Notifikasi kalau event berubah jadwal</li></ul>
</div></div>`;

const qr = (code) => [...Array(441)].map((_, i) => { const x = i % 21, y = (i / 21) | 0;
  const f = (a, b) => x >= a && x < a + 7 && y >= b && y < b + 7;
  const on = f(0, 0) || f(14, 0) || f(0, 14) ? !(((x % 14 === 1 || x % 14 === 5) && y % 14 > 0 && y % 14 < 6) || ((y % 14 === 1 || y % 14 === 5) && x % 14 > 0 && x % 14 < 6)) : (code.charCodeAt((x * 7 + y * 3) % 8) * (x + 1) * (y + 3)) % 7 < 3;
  return on ? `<rect x="${x}" y="${y}" width="1" height="1"/>` : ""; }).join("");

window.VIEWS = {
  list,
  home: (c) => {
    const cnt = (k) => k === "Semua" ? c.EVENTS.length : c.EVENTS.filter((e) => e.cat === k).length;
    const cities = [...new Set(c.EVENTS.map((e) => e.city))].map((k) => [k, c.EVENTS.filter((e) => e.city === k).length]).sort((a, b) => b[1] - a[1]);
    return `${topbar(c, true)}<div class="wrap layout">
      <aside class="f"><h4>KATEGORI</h4><div>${c.CATS.map((k) => `<button data-act="cat" data-v="${k}" aria-pressed="${k === c.cat}">${k}<span class="mono">${cnt(k)}</span></button>`).join("")}</div>
        <ul class="cities"><h4>KOTA</h4>${cities.map(([k, n]) => `<li>${k}<span class="mono">${n}</span></li>`).join("")}</ul></aside>
      <main><div class="intro"><div><h1>Event mendatang</h1><p>Diurutkan dari tanggal terdekat. Bar menunjukkan tiket yang sudah terjual.</p></div></div>
        <div id="list">${list(c)}</div></main>
    </div>`;
  },
  event: (c) => {
    const e = c.ev;
    return `${topbar(c, false)}<div class="wrap">
      <div class="crumb"><a href="#/">← Event mendatang</a> / ${e.cat}</div>
      <div class="dl"><section>
        <img class="hero" src="${e.img}" alt="">
        <h1>${e.title}</h1>
        <table class="meta"><tr><th>Tanggal</th><td>${c.dt(e.date, { weekday: "long", day: "numeric", month: "long", year: "numeric" })}</td></tr>
          <tr><th>Jam</th><td>19.00 WIB · gerbang buka 17.00</td></tr><tr><th>Lokasi</th><td>${e.venue}, ${e.city}</td></tr><tr><th>Kategori</th><td>${e.cat}</td></tr></table>
        <div class="about"><h2>Tentang event</h2><p>${e.title} di ${e.venue}, ${e.city}. Tunjukkan e-ticket QR di pintu masuk; satu QR untuk satu orang.</p><p>Tiket tidak dapat dikembalikan kecuali acara dibatalkan penyelenggara.</p></div>
      </section>
      <aside class="box"><h2 style="font-size:16px;margin-bottom:6px">Tiket</h2>
        ${e.tickets.map((t) => { const n = c.qty[t.id] || 0, hot = t.left && t.left <= 20; return `<div class="tt">
          <b>${t.name}</b><span class="pr">${c.rp(t.price)}</span>
          <div class="meta2"><div style="flex:1"><div class="bar ${hot ? "hot" : ""}"><i style="width:${pct(t)}%"></i></div><span class="left mono ${hot || !t.left ? "hot" : ""}">${t.left ? `sisa ${t.left} / ${t.quota}` : "terjual habis"}</span></div>
          ${t.left ? `<div class="q"><button data-act="qty" data-t="${t.id}" data-v="-1" ${n ? "" : "disabled"} aria-label="Kurangi">−</button><span aria-live="polite">${n}</span><button data-act="qty" data-t="${t.id}" data-v="1" ${n >= Math.min(t.left, 10) ? "disabled" : ""} aria-label="Tambah">+</button></div>` : ""}</div>
        </div>`; }).join("")}
        <div class="tot"><span>${c.count} tiket</span><b class="mono">${c.rp(c.total)}</b></div>
        <button class="b p wide" data-act="buy" ${c.count ? "" : "disabled"}>${c.user ? "Lanjut ke pembayaran" : "Masuk untuk membeli"}</button>
        <p class="hint">Maks. 10 tiket per transaksi. Tiket ditahan 15 menit saat checkout.</p>
      </aside></div></div>
      <div class="mbar"><div><div class="left">${c.count} tiket</div><b class="mono">${c.rp(c.total)}</b></div><button class="b p" data-act="buy" ${c.count ? "" : "disabled"}>${c.user ? "Bayar" : "Masuk & beli"}</button></div>`;
  },
  login: (c) => auth(c, false),
  register: (c) => auth(c, true),
  checkout: (c) => {
    const o = c.order, M = [["qris", "QRIS", "Semua e-wallet & m-banking"], ["va", "Virtual Account", "BCA, BNI, BRI, Mandiri"], ["gopay", "GoPay", "Langsung dari aplikasi"]];
    return `${topbar(c, false)}<div class="wrap">
      <div class="steps"><span>1. Pilih tiket ✓</span><span>—</span><b>2. Pembayaran</b><span>—</span><span>3. E-ticket</span></div>
      <div class="dl"><section>
        <div class="warnbar"><span>Selesaikan dalam waktu ini atau tiket dilepas ke pembeli lain.</span><b class="mono" data-countdown>15:00</b></div>
        <h2>Metode pembayaran</h2>
        ${M.map(([v, n, s]) => `<button class="pm" data-act="pay-method" data-v="${v}" aria-pressed="${o.pay === v}"><span class="o"></span><span><b>${n}</b><small>${s}</small></span></button>`).join("")}
      </section>
      <aside class="box"><h2 style="font-size:16px">${o.ev.title}</h2><p class="hint" style="margin:2px 0 12px">${c.dt(o.ev.date)} · ${o.ev.venue}</p>
        ${o.lines.map((l) => `<div class="row2"><span>${l.n}× ${l.name}</span><span class="mono">${c.rp(l.n * l.price)}</span></div>`).join("")}
        <div class="row2"><span>Biaya layanan</span><span class="mono">Rp0</span></div>
        <div class="tot"><span>Total</span><b class="mono">${c.rp(o.total)}</b></div>
        <button class="b p" data-act="pay">Bayar sekarang</button><p class="hint">Prototipe: tombol ini mensimulasikan pembayaran sukses.</p></aside></div></div>`;
  },
  done: (c) => {
    const o = c.order;
    return `${topbar(c, false)}<div class="wrap"><div class="steps"><span>1. Pilih tiket ✓</span><span>—</span><span>2. Pembayaran ✓</span><span>—</span><b>3. E-ticket</b></div>
      <article class="et"><div class="ok">Pembayaran diterima. E-ticket juga dikirim ke ${c.esc(c.user?.email)}.</div>
      <div class="in2"><div><h1>${o.ev.title}</h1><table class="meta"><tr><th>Tanggal</th><td>${c.dt(o.ev.date)}, 19.00</td></tr><tr><th>Lokasi</th><td>${o.ev.venue}</td></tr><tr><th>Tiket</th><td>${o.lines.map((l) => l.n + "× " + l.name).join(", ")}</td></tr></table></div>
        <div><svg viewBox="-1 -1 23 23" role="img" aria-label="QR tiket (contoh)"><rect x="-1" y="-1" width="23" height="23" fill="#fff"/>${qr(o.code)}</svg><code class="mono">${o.code}</code></div></div>
      <div class="foot"><span class="hint" style="margin:0">QR contoh untuk prototipe</span><a class="b" href="#/">Kembali ke daftar event</a></div></article></div>`;
  },
};
</script>
<script src="proto.js"></script>
</body>
</html>
